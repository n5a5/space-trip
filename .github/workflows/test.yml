name: Phone tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:   # four groups in parallel so the whole run stays well under the time limit
        flows:
          - "start places discover landing ramp high countries where landview audio pets drive mars blue camzoom roadtrip wherefix launchfly bigger minimap drawbudget homes deskvoice kbglobe mutedcap college pqshare"
          - "planets sparkles daily sizes sound uturn moonframe coaststart earthtap memory arrow back home skycard allsites skyglare moonplay roadmission kscstart voicegaps"
          - "explorer placequiz moon weather fly passport voice tapguard hover livingworld ride states chaos realclouds spacefix focusbtns walkworlds nextworld phases pluto homesfair phland reading"
          - "mercmoon seas polar walkstart flyksc hudclear marsdesk flyafterdrive faceclip"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Playwright Chromium
        working-directory: dev
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Serve the site
        run: (python3 -m http.server 8765 > /tmp/http.log 2>&1 &) && sleep 2
      - name: Run phone-size flows
        run: mkdir -p dev/tests/out && node dev/tests/run.js ${{ matrix.flows }}
        env: { NODE_PATH: dev/node_modules }
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: "screenshots-${{ strategy.job-index }}", path: dev/tests/out, retention-days: 7 }
