name: Phone tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Playwright Chromium
        working-directory: dev
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Serve the site
        run: (python3 -m http.server 8765 > /tmp/http.log 2>&1 &) && sleep 2
      - name: Run phone-size flows
        run: mkdir -p dev/tests/out && node dev/tests/run.js start planets explorer places fly back states mars home chaos
        env: { NODE_PATH: dev/node_modules }
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: screenshots, path: dev/tests/out, retention-days: 7 }
